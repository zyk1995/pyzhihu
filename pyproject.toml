[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhihu-spider"
version = "0.2.0"
description = "抓取知乎问题下的全部回答"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
zhihu-answers = "spider.answers.cli:main"

[tool.setuptools.packages.find]
include = ["spider*"]
